<!DOCTYPE html>
<html>
<head>
    <title>Gate Masuk</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🚗 Gate Masuk</h1>

    <form method="POST">

        <input
            type="text"
            name="rfid"
            placeholder="Masukkan RFID"
            required>

        <br><br>

        <button type="submit">
            Validasi RFID
        </button>

    </form>

    {% if hasil %}
        <div class="card hasil">
            <h3>{{ hasil }}</h3>
        </div>
    {% endif %}

    <br>

    <a href="/">⬅ Kembali ke Dashboard</a>

</div>

</body>
</html>
