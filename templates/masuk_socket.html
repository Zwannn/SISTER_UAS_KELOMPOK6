<!DOCTYPE html>
<html>

<head>

    <title>Gate Masuk Socket</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🚗 Gate Masuk Socket</h1>

        <p>
            Validasi RFID menggunakan TCP Socket
        </p>

        <form method="POST">

            <input
                type="text"
                name="rfid"
                placeholder="Masukkan RFID"
                required>

            <br><br>

            <button type="submit">
                Validasi RFID
            </button>

        </form>

        {% if hasil %}

        <div class="result-box">

            <h3>Hasil Validasi</h3>

            <p>{{ hasil }}</p>

        </div>

        {% endif %}

        <br>

        <a href="/">
            ⬅ Kembali ke Dashboard
        </a>

    </div>

</body>

</html>
